packages:
  - apps/*
  - packages/*
  - scripts
allowBuilds:
  bufferutil: false
  esbuild: true
  utf-8-validate: false
# Orca's kit SDK declares a peer on @solana/kit ^5; we pin kit 7. scripts/spike-orca.ts ran pool
# creation, liquidity and swaps on devnet under kit 7 (see docs/architecture.md), so the range is
# widened here for exactly these packages, which are pinned to the versions that were tested.
peerDependencyRules:
  allowedVersions:
    "@orca-so/whirlpools>@solana/kit": "7"
    "@orca-so/whirlpools-client>@solana/kit": "7"
    "@orca-so/tx-sender>@solana/kit": "7"
    # The older program clients the Orca SDK brings with it (ours are newer and unaffected).
    "@solana-program/memo@0.10.0>@solana/kit": "7"
    "@solana-program/token-2022@0.6.1>@solana/kit": "7"
    "@solana-program/system@0.10.0>@solana/kit": "7"
    "@solana-program/address-lookup-table@0.10.0>@solana/kit": "7"
    "@solana-program/compute-budget@0.11.0>@solana/kit": "7"
    "@solana-program/token@0.9.0>@solana/kit": "7"
