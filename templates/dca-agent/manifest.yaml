# Buys a little SOL with USDC every day, from its own weekly allowance. Runs locally.
name: dca-agent
runtime: local
model: openai-compatible:https://integrate.api.nvidia.com/v1
model_id: meta/muse-glimmer-30b
api_key_env: NVIDIA_API_KEY
schedule: "0 9 * * *"
allowance: { mint: USDC, amount: 20, period: weekly }
fee_budget: { sol: 0.02 }
permissions:
  programs: [jupiter, subscriptions]
  destinations: [self]
  max_tx_usd: 10
  approve_above_usd: 5
tools: [pyth-price, balances, jupiter-quote, jupiter-swap, pull-allowance]
prompt: ./prompt.md
